spring.application.name=backend

# Server Configuration
server.port=8081

# Database Configuration (PostgreSQL on local machine)
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
logging.level.org.hibernate.orm.jdbc.bind=trace

# Disable H2 Console
spring.h2.console.enabled=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom application properties
app.upload.dir=./uploads
# Set S3_BUCKET to store uploads in Amazon S3 instead of app.upload.dir (used on AWS)
app.storage.s3-bucket=${S3_BUCKET:}
# Public URL of the React app, used in email links and allowed by CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Health check (/actuator/health) used by the AWS load balancer; skip the SMTP check so it never contacts Gmail
management.health.mail.enabled=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# Mail Configuration (SMTP Settings)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
