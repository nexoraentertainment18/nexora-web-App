spring.application.name=backend

# Server Configuration
server.port=8081

# Database Configuration (PostgreSQL on local machine)
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
logging.level.org.hibernate.orm.jdbc.bind=trace

# Disable H2 Console
spring.h2.console.enabled=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom application properties
app.upload.dir=./uploads
# Retained for deployment configuration compatibility; new image uploads use Cloudinary.
app.storage.s3-bucket=${S3_BUCKET:}
# Public URL of the React app, used in email links and allowed by CORS
# Add explicit IP:port origins for EC2 / Docker / local testing.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cors.production-origin=${CORS_PRODUCTION_ORIGIN:}

# Health check (/actuator/health) used by the AWS load balancer; skip the SMTP check so it never contacts Gmail
management.health.mail.enabled=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# Mail Configuration (SMTP Settings)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Cloudinary Configuration (Image Storage)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
