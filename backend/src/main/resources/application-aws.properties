# Settings for the AWS environments (dev and prod). ECS sets SPRING_PROFILES_ACTIVE=aws.

# Don't log SQL or bound parameter values (they include password hashes and tokens)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.orm.jdbc.bind=info

# Finish in-flight requests when ECS replaces a container during a deploy
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
