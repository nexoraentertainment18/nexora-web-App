version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nexora}
      POSTGRES_USER: ${DB_USERNAME:-nexora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexora}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:8081"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/nexora}
      DB_USERNAME: ${DB_USERNAME:-nexora}
      DB_PASSWORD: ${DB_PASSWORD:-nexora}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_TARGET: http://backend:8081
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://backend:8081
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
