AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Nexora shared resources, created once per AWS account and used by both dev and prod:
  the ECR repository for backend Docker images and the IAM role GitHub Actions uses to deploy.
  Name the stack nexora-shared.

Parameters:
  GitHubRepository:
    Type: String
    Default: nexoraentertainment18/nexora-web-App
    Description: GitHub repository (owner/name, exact capitalisation) that is allowed to deploy.
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >-
      Choose false only if IAM > Identity providers already lists token.actions.githubusercontent.com.

Conditions:
  CreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, 'true']

Resources:
  # Lets GitHub Actions sign in to AWS with short-lived tokens instead of stored access keys
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: nexora-backend
      # Mutable so the "dev" and "prod" tags can move to each newly deployed image
      ImageTagMutability: MUTABLE
      # Delete the images with the stack; they are rebuilt from a commit at any time
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Never expire the images currently running in dev and prod",
                "selection": { "tagStatus": "tagged", "tagPrefixList": ["dev", "prod"], "countType": "imageCountMoreThan", "countNumber": 1000 },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Remove untagged images after 14 days",
                "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 14 },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 3,
                "description": "Keep the 50 most recent commit images",
                "selection": { "tagStatus": "tagged", "tagPrefixList": ["sha-"], "countType": "imageCountMoreThan", "countNumber": 50 },
                "action": { "type": "expire" }
              }
            ]
          }

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: nexora-github-deploy
      Description: Assumed by the GitHub Actions deploy workflow for the dev and prod environments.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Only jobs that run in the GitHub "dev" or "prod" environment of this repository
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepository}:environment:dev
                  - !Sub repo:${GitHubRepository}:environment:prod
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrPushImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt BackendRepository.Arn
              - Sid: ReadStackOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/nexora-*/*
              - Sid: RegisterTaskDefinitions
                Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                Resource: '*'
              - Sid: DeployEcsServices
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/nexora-*/*
              - Sid: PassTaskRolesToEcs
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/nexora-*
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: UploadFrontend
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::nexora-*-frontend-${AWS::AccountId}
                  - !Sub arn:${AWS::Partition}:s3:::nexora-*-frontend-${AWS::AccountId}/*
              - Sid: InvalidateCloudFrontCache
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*

Outputs:
  EcrRepositoryUri:
    Description: Where the deploy workflow pushes backend images.
    Value: !GetAtt BackendRepository.RepositoryUri
    Export:
      Name: !Sub ${AWS::StackName}-EcrRepositoryUri
  GitHubDeployRoleArn:
    Description: Save this as the AWS_DEPLOY_ROLE_ARN variable in the GitHub repository.
    Value: !GetAtt GitHubDeployRole.Arn
