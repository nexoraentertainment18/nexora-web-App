AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Nexora environment (dev or prod): network, RDS PostgreSQL, S3 buckets for the React app and
  uploaded images, the Spring Boot backend on ECS Fargate behind a private load balancer, and one
  CloudFront HTTPS address that serves the app, /api/* and /api/v1/uploads/*.
  Name the stack nexora-dev or nexora-prod.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Environment
        Parameters: [EnvName, SharedStackName]
      - Label:
          default: Email (Gmail SMTP)
        Parameters: [MailUsername, MailPassword]
      - Label:
          default: Sizing
        Parameters: [DesiredCount, TaskCpu, TaskMemory, DatabaseInstanceClass, DatabaseStorageGiB, VpcCidr]

Parameters:
  EnvName:
    Type: String
    AllowedValues: [dev, prod]
    Description: Must match the stack name (nexora-dev or nexora-prod).
  SharedStackName:
    Type: String
    Default: nexora-shared
    Description: Name of the stack created from shared.yml.
  MailUsername:
    Type: String
    Description: Gmail address that sends verification and password-reset emails.
  MailPassword:
    Type: String
    NoEcho: true
    Description: Gmail app password for that address.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10
    Description: Number of backend containers. 2 in prod keeps the API up if one container fails. 0 pauses the backend.
  TaskCpu:
    Type: String
    Default: '512'
    AllowedValues: ['512', '1024', '2048']
    Description: CPU per backend container (1024 = 1 vCPU).
  TaskMemory:
    Type: String
    Default: '1024'
    AllowedValues: ['1024', '2048', '3072', '4096']
    Description: Memory per backend container in MiB. 1024 CPU needs at least 2048, 2048 CPU needs 4096.
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium]
  DatabaseStorageGiB:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
  VpcCidr:
    Type: String
    Default: 10.10.0.0/16
    AllowedPattern: ^10\.\d{1,3}\.0\.0/16$
    Description: Private IP range of this environment's network.

Conditions:
  IsProd: !Equals [!Ref EnvName, prod]

Resources:
  # ---------------------------------------------------------------------------
  # Network. Backend containers run in public subnets (they need outbound internet
  # for Gmail and to pull images) but accept traffic only from the load balancer.
  # The database and load balancer live in private subnets with no internet route.
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub nexora-${EnvName}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub nexora-${EnvName}

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub nexora-${EnvName}-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub nexora-${EnvName}-public-2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - Key: Name
          Value: !Sub nexora-${EnvName}-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - Key: Name
          Value: !Sub nexora-${EnvName}-private-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub nexora-${EnvName}-public

  PublicInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub nexora-${EnvName}-private

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub nexora-${EnvName} load balancer, reachable only from CloudFront inside the VPC
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: CloudFront VPC origin network interfaces in this VPC
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref VpcCidr

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub nexora-${EnvName} backend containers
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: Load balancer
          IpProtocol: tcp
          FromPort: 8081
          ToPort: 8081
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub nexora-${EnvName} PostgreSQL, reachable only from the backend
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: Backend containers
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BackendSecurityGroup

  # ---------------------------------------------------------------------------
  # Secrets (Secrets Manager). Passwords are generated here and never typed by hand.
  # ---------------------------------------------------------------------------
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub Nexora ${EnvName} PostgreSQL master user
      GenerateSecretString:
        SecretStringTemplate: '{"username":"nexora"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub Nexora ${EnvName} backend secrets (JWT signing key and Gmail credentials)
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"MAIL_USERNAME":"${MailUsername}","MAIL_PASSWORD":"${MailPassword}"}'
        GenerateStringKey: JWT_SECRET
        PasswordLength: 64
        ExcludePunctuation: true

  # ---------------------------------------------------------------------------
  # Database: RDS PostgreSQL in the private subnets
  # ---------------------------------------------------------------------------
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub nexora-${EnvName} private subnets
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  Database:
    Type: AWS::RDS::DBInstance
    # A final snapshot is kept if the database is ever deleted or replaced
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub nexora-${EnvName}
      Engine: postgres
      EngineVersion: '17.11'
      AutoMinorVersionUpgrade: true
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !Ref DatabaseStorageGiB
      MaxAllocatedStorage: 200
      StorageType: gp3
      StorageEncrypted: true
      DBName: nexora
      MasterUsername: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: !If [IsProd, 7, 1]
      DeletionProtection: !If [IsProd, true, false]
      CopyTagsToSnapshot: true

  # ---------------------------------------------------------------------------
  # S3: built React app and uploaded images. Both stay private; only CloudFront reads them.
  # Buckets are kept if the stack is deleted, so user uploads are never lost by accident.
  # ---------------------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub nexora-${EnvName}-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  UploadsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub nexora-${EnvName}-uploads-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Prod keeps previous versions for 30 days so a deleted or overwritten image can be recovered
      VersioningConfiguration: !If
        - IsProd
        - Status: Enabled
        - !Ref AWS::NoValue
      LifecycleConfiguration:
        Rules:
          - Id: cleanup
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  UploadsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${UploadsBucket.Arn}/uploads/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ---------------------------------------------------------------------------
  # Load balancer (internal: it has no public address, CloudFront reaches it privately)
  # ---------------------------------------------------------------------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub nexora-${EnvName}
      Type: application
      Scheme: internal
      Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub nexora-${EnvName}-backend
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8081
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  # ---------------------------------------------------------------------------
  # Backend: Spring Boot container on ECS Fargate
  # ---------------------------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub nexora-${EnvName}

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/nexora-${EnvName}-backend
      RetentionInDays: !If [IsProd, 30, 7]

  # Used by ECS itself to pull the image, write logs and read the secrets
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub nexora-${EnvName}-task-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseSecret
                  - !Ref AppSecret

  # Used by the Spring Boot app while running: it may only write uploaded images
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub nexora-${EnvName}-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-uploads
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${UploadsBucket.Arn}/uploads/*

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub nexora-${EnvName}-backend
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          # The deploy workflow moves the "dev"/"prod" tag to every image it deploys successfully
          Image: !Sub
            - ${RepositoryUri}:${EnvName}
            - RepositoryUri:
                Fn::ImportValue: !Sub ${SharedStackName}-EcrRepositoryUri
          Essential: true
          PortMappings:
            - ContainerPort: 8081
              Protocol: tcp
          StopTimeout: 30
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: aws
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: DB_URL
              Value: !Sub jdbc:postgresql://${Database.Endpoint.Address}:${Database.Endpoint.Port}/nexora
            - Name: S3_BUCKET
              Value: !Ref UploadsBucket
            - Name: FRONTEND_URL
              Value: !Sub https://${Distribution.DomainName}
          Secrets:
            - Name: DB_USERNAME
              ValueFrom: !Sub '${DatabaseSecret}:username::'
            - Name: DB_PASSWORD
              ValueFrom: !Sub '${DatabaseSecret}:password::'
            - Name: JWT_SECRET
              ValueFrom: !Sub '${AppSecret}:JWT_SECRET::'
            - Name: MAIL_USERNAME
              ValueFrom: !Sub '${AppSecret}:MAIL_USERNAME::'
            - Name: MAIL_PASSWORD
              ValueFrom: !Sub '${AppSecret}:MAIL_PASSWORD::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: !Sub nexora-${EnvName}-backend
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      # Spring Boot needs time to start before the load balancer judges its health
      HealthCheckGracePeriodSeconds: 180
      DeploymentConfiguration:
        # Start the new version next to the old one and switch only when it is healthy
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
          SecurityGroups: [!Ref BackendSecurityGroup]
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8081
          TargetGroupArn: !Ref BackendTargetGroup

  # ---------------------------------------------------------------------------
  # CloudFront: the single public HTTPS address for this environment
  #   /api/v1/uploads/*  -> uploads bucket
  #   /api/*             -> backend (through the private load balancer)
  #   everything else    -> React app bucket
  # ---------------------------------------------------------------------------
  S3OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub nexora-${EnvName}-s3
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  BackendVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    DependsOn: InternetGatewayAttachment
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub nexora-${EnvName}-backend
        Arn: !Ref LoadBalancer
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only

  SpaRoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub nexora-${EnvName}-spa-routing
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for React Router paths (any path without a file extension)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.lastIndexOf('.') <= uri.lastIndexOf('/')) {
            request.uri = '/index.html';
          }
          return request;
        }

  UploadsPathFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub nexora-${EnvName}-uploads-path
      AutoPublish: true
      FunctionConfig:
        Comment: Map /api/v1/uploads/<file> to the uploads/<file> key in S3
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = request.uri.replace(/^\/api\/v1\/uploads\//, '/uploads/');
          return request;
        }

  # Never cache API responses, and pass the JWT (Authorization header) through to the backend
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub nexora-${EnvName}-api
        Comment: No caching; forwards the Authorization header to the backend
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization]
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all

  # Uploaded files may be shown as images but can never run as a web page
  UploadsResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub nexora-${EnvName}-uploads
        Comment: Block scripts in user-uploaded files
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox"
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub Nexora ${EnvName}
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        # Includes edge locations in India, Asia, Europe and North America
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt S3OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: uploads
            DomainName: !GetAtt UploadsBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt S3OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: backend
            DomainName: !GetAtt LoadBalancer.DNSName
            VpcOriginConfig:
              VpcOriginId: !GetAtt BackendVpcOrigin.Id
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRoutingFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/v1/uploads/*
            TargetOriginId: uploads
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            ResponseHeadersPolicyId: !Ref UploadsResponseHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt UploadsPathFunction.FunctionMetadata.FunctionARN
          - PathPattern: /api/*
            TargetOriginId: backend
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

Outputs:
  AppUrl:
    Description: Open this address to use the app.
    Value: !Sub https://${Distribution.DomainName}
  DistributionId:
    Value: !Ref Distribution
  FrontendBucketName:
    Value: !Ref FrontendBucket
  UploadsBucketName:
    Value: !Ref UploadsBucket
  EcsClusterName:
    Value: !Ref Cluster
  EcsServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionFamily:
    Value: !Sub nexora-${EnvName}-backend
  BackendLogGroup:
    Description: CloudWatch log group with the Spring Boot logs.
    Value: !Ref BackendLogGroup
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Description: Secrets Manager secret holding the database username and password.
    Value: !Ref DatabaseSecret
